<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d3560"><meta name="referrer" content="no-referrer">
<title>Welcome to Attendigo</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light dark}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:linear-gradient(145deg,#eaf3ff,#fff 55%,#e9f5f1);color:#12365c}
main{width:min(92vw,470px);padding:36px 28px;text-align:center;border:1px solid #dce7f3;background:#fff;border-radius:24px;box-shadow:0 24px 70px #0f38601c}
.mark{width:72px;height:72px;border-radius:20px;background:#e5f0ff;display:grid;place-items:center;margin:0 auto 15px;font-size:34px}
h1{font-size:clamp(27px,6vw,34px);letter-spacing:-.04em;margin:0 0 4px}p{line-height:1.55} .lead{margin:5px 0 30px;color:#60768c;font-size:14px}
.ring{width:27px;height:27px;border:3px solid #dce8f5;border-top-color:#266bb6;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 15px}
@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.ring{animation:none}}
.status{font-weight:600;font-size:15px;margin:0}.hint{color:#6a7d90;font-size:13px;margin:7px 0 22px}
a{display:block;padding:14px 20px;background:#1764ad;color:white;text-decoration:none;border-radius:12px;font-weight:650}
a:focus-visible{outline:3px solid #1e82e6;outline-offset:3px}.note{font-size:12px;color:#718297;margin:22px 0 0}
@media(prefers-color-scheme:dark){body{background:linear-gradient(145deg,#091a2c,#152e45);color:#f1f6fa}main{background:#14283c;border-color:#2f475e}.mark{background:#234565}.lead,.hint,.note{color:#aabaca}}
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true">🎓</div>
<h1>Attendigo</h1>
<p class="lead">Smart School Attendance &amp; Management</p>
<div class="ring" aria-hidden="true"></div>
<p class="status" role="status">Preparing your school workspace</p>
<p class="hint">The school server may need a moment to wake up.</p>
<a href="https://student-attendance-tracker-jmp4.onrender.com/portal-login.html" rel="noopener">Continue to Attendigo</a>
<p class="note">Preview only. Your existing Attendigo domain and account sessions have not been changed.</p>
</main>
<script>
// Best-effort wake-up request; intentionally does not process authentication,
// inspect session data, or auto-redirect across origins.
fetch('https://student-attendance-tracker-jmp4.onrender.com/api/health',{mode:'no-cors',cache:'no-store'}).catch(()=>{});
</script>
</body></html>
