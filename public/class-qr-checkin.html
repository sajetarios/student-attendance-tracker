<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Class QR Check-in · Attendigo</title>
<link rel="stylesheet" href="/portal.css">
<link rel="stylesheet" href="/attendigo-brand.css?v=2">

<link rel="stylesheet" href="/attendigo-dark-unified.css?v=1">
<link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/typography.css?v=1">
<link rel="icon" type="image/png" href="/assets/attendigo-favicon.png?v=2">
<style>
:root{color-scheme:light dark}
body.portal-page{min-height:100dvh;box-sizing:border-box;margin:0;padding:clamp(18px,4vw,32px) 14px 36px}
.qr-brand{display:flex;align-items:center;justify-content:center;margin:0 auto 22px;gap:11px;max-width:max-content;border-radius:16px;padding:11px 17px;background:#101f45;color:#fff;box-shadow:0 5px 18px #101f4520}
.qr-brand img{width:42px;height:42px;object-fit:contain;flex-shrink:0}
.qr-brand-name{display:block;font-size:1.5rem;font-weight:750;letter-spacing:-.045em;line-height:1.05;color:#fff}
.qr-brand-tagline{display:block;color:#d4dff2;font-size:.7rem;margin-top:3px;letter-spacing:.01em}
main{max-width:440px;margin:0 auto;padding:clamp(20px,5vw,28px);background:var(--surface,#fff);border:1px solid var(--border,#e1e7ee);border-radius:18px;box-shadow:0 12px 36px rgba(13,30,54,.06)}
h1{font-size:clamp(1.45rem,5vw,1.7rem);letter-spacing:-.025em;line-height:1.18;margin:0 0 9px}
p{line-height:1.48}
#intro{font-size:.94rem;margin:0 0 18px;color:var(--text-secondary,#44536a)}
.qr-field{display:grid;gap:7px;margin:0 0 16px}
.qr-field label{font-size:.93rem;font-weight:650}
.qr-field input{width:100%;min-height:46px;font:inherit;font-size:1rem;padding:11px 13px;border-radius:10px;border:1px solid #8b9db5;box-sizing:border-box;color:var(--text-primary,inherit);background:var(--surface,#fff)}
.qr-field input:focus-visible{outline:3px solid #4e86c855;outline-offset:1px}
.qr-action{padding:12px 18px;min-height:46px;border:0;border-radius:10px;background:#18539e;color:#fff;cursor:pointer;font:inherit;font-weight:650;width:100%}
.qr-action:disabled{opacity:.65;cursor:not-allowed}
.qr-remember{display:flex;align-items:flex-start;gap:10px;margin:4px 0 18px;font-size:.81rem;line-height:1.4;color:var(--text-secondary,#526078)}
.qr-remember input{width:17px;height:17px;flex-shrink:0;margin-top:2px}
#message{padding:11px 13px;margin:15px 0 0;border-radius:10px;background:var(--qr-status-bg,#eff5fd);color:var(--qr-status-fg,#24486c);font-size:.84rem;line-height:1.4}
#message[data-state="error"]{background:#fff0ef;color:#8c2530}
#message[data-state="success"]{background:#edf8f0;color:#205d39}
.qr-links{display:grid;gap:10px;margin:18px 0 0}
.qr-secondary{display:flex;align-items:center;justify-content:center;gap:9px;text-align:center;min-height:44px;box-sizing:border-box;border:1px solid var(--border,#c5d0de);border-radius:10px;padding:10px 14px;color:var(--text-primary,#1b3153);background:var(--surface,#fff);text-decoration:none;font-size:.91rem;font-weight:600}
.qr-secondary:focus-visible{outline:3px solid #4e86c855;outline-offset:2px}
.qr-help{display:block;text-align:center;font-size:.82rem;color:var(--text-secondary,#526078);text-decoration:underline;text-underline-offset:3px;padding:6px}
.qr-divider{display:flex;align-items:center;gap:12px;color:var(--text-secondary,#66768c);font-size:.78rem;margin:0}
.qr-divider:before,.qr-divider:after{content:"";height:1px;flex:1;background:var(--border,#d8e0e9)}
[hidden]{display:none!important}
@media(prefers-color-scheme:dark){#message{background:#1b3352;color:#d6e7ff}#message[data-state="error"]{background:#4c2228;color:#ffe1df}#message[data-state="success"]{background:#193d2b;color:#c5f6d8}}
@media(max-width:540px){body.portal-page{padding:18px 12px 28px}.qr-brand{margin-bottom:16px}main{padding:22px 18px;border-radius:16px}}
</style>
</head>
<body class="portal-page">
<header class="qr-brand" aria-label="Attendigo"><img src="/assets/attendigo-favicon.png?v=2" alt="" width="42" height="42"><div><span class="qr-brand-name">Attendigo</span><span class="qr-brand-tagline">Every learner counts.</span></div></header>
<main>
<h1>Class attendance</h1>
<p id="intro">Checking your teacher's attendance method…</p>
<form id="pinForm" method="post" action="/api/class-qr/check-in/pin" hidden>
  <div class="qr-field"><label for="studentId">Student ID</label>
    <input id="studentId" name="studentId" required maxlength="160" autocomplete="username" placeholder="Enter your registered Student ID"></div>
  <div class="qr-field"><label for="attendancePin">Private six-digit Attendance PIN</label>
    <input id="attendancePin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="off" required placeholder="••••••"></div>
  <label class="qr-remember"><input id="rememberStudentId" type="checkbox">Remember Student ID on this device (not recommended on shared phones)</label>
  <button class="qr-action" id="pinConfirm" type="submit">Confirm class attendance</button>
</form>
<section id="legacyFlow" hidden>
  <button class="qr-action" id="checkin" type="button" disabled>Confirm attendance</button>
  <p><a class="qr-secondary" id="studentSignIn" hidden href="/portal-login.html?mode=student">Sign in to confirm attendance</a></p>
</section>
<p id="message" role="status" aria-live="polite">Reading the QR code…</p>
<nav class="qr-links" aria-label="Other attendance options">
<button class="qr-secondary" type="button" id="copyQrLink" hidden>Copy QR link for my signed-in browser</button>
<button class="qr-secondary" type="button" id="retryCheckin" hidden>Retry connection</button>
<span class="qr-divider" id="fallbackDivider" hidden>Or continue with</span>
<a class="qr-secondary" href="/portal-login.html?mode=student" id="useStudentLogin" hidden>Student account sign-in</a>
<a class="qr-help" href="/student-portal.html" id="leaveCheckin">Need to create or reset your Attendance PIN?</a>
</nav>
</main>
<script>
(()=>{
'use strict';
const q=new URLSearchParams(location.search);
const sessionId=q.get('sessionId')||'',qrToken=q.get('token')||'';
const form=document.getElementById('pinForm'),pin=document.getElementById('attendancePin'),studentId=document.getElementById('studentId');
const confirm=document.getElementById('pinConfirm'),msg=document.getElementById('message'),intro=document.getElementById('intro');
const pendingKey='schoolAttendance.pendingClassQr',rememberKey='attendigo.classQr.rememberedStudentId';
const clearPending=()=>{try{sessionStorage.removeItem(pendingKey);}catch{}};
const legacy=document.getElementById('legacyFlow'),legacyButton=document.getElementById('checkin');
const legacyOption=document.getElementById('useStudentLogin'),fallbackDivider=document.getElementById('fallbackDivider');
const retry=document.getElementById('retryCheckin');
const copyQr=document.getElementById('copyQrLink');
copyQr.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);show('QR link copied. Return to your signed-in Student Portal, tap Scan class QR, and paste the link.');}catch{show('Copy this page’s address using your browser menu, then paste it in your signed-in Student Portal.');}});
retry.addEventListener('click',initialize);
const show=(value,state='')=>{msg.textContent=value;msg.dataset.state=state;};
document.getElementById('leaveCheckin').addEventListener('click',()=>clearPending());
const validQr=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(sessionId)&&/^[a-f0-9]{64}$/i.test(qrToken);
if(!validQr){intro.textContent='Invalid class QR code.';show('Please scan the latest QR shown by your teacher.','error');return;}
const studentSignIn=document.getElementById('studentSignIn');
try{sessionStorage.setItem(pendingKey,location.pathname+location.search);}catch{}
studentSignIn.href='/portal-login.html?mode=student&returnTo='+encodeURIComponent(location.pathname+location.search);
legacyOption.href=studentSignIn.href;
let remembered='';
try{remembered=localStorage.getItem(rememberKey)||'';}catch{}
if(remembered){studentId.value=remembered;document.getElementById('rememberStudentId').checked=true;}
form.addEventListener('submit',async event=>{
 event.preventDefault();
 if(!studentId.value.trim()||!/^[0-9]{6}$/.test(pin.value)){show('Enter your Student ID and exactly six PIN digits.','error');return;}
 confirm.disabled=true;show('Verifying attendance with the school server…');
 const id=studentId.value.trim(),pinValue=pin.value;pin.value='';
 try{
  const r=await fetch('/api/class-qr/check-in/pin',{method:'POST',credentials:'omit',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId,token:qrToken,studentId:id,pin:pinValue})});
  const d=await r.json().catch(()=>({}));
  if(r.ok){
   try{if(document.getElementById('rememberStudentId').checked)localStorage.setItem(rememberKey,id);else localStorage.removeItem(rememberKey);}catch{}
   clearPending();form.hidden=true;
   show('Attendance confirmed: '+d.status+'. You may close this page.','success');return;
  }
  if(d.alreadyRecorded){
   clearPending();form.hidden=true;show('Attendance has already been recorded for this class.','success');return;
  }
  if(r.status===410){form.hidden=true;show('This QR code expired or the session ended. Scan the latest teacher QR.','error');return;}
  show(r.status===403?'Unable to confirm attendance. Check your Student ID and PIN.':(d.error||'Attendance not recorded. Please try again.'),'error');
 }catch{show('Network unavailable. Attendance was NOT recorded. Ask your teacher for assistance.','error');}
 finally{confirm.disabled=false;}
});
function resetOptions(){
 form.hidden=true;legacy.hidden=true;legacyButton.hidden=false;legacyButton.disabled=true;legacyButton.textContent='Confirm attendance';
 studentSignIn.hidden=true;legacyOption.hidden=true;fallbackDivider.hidden=true;retry.hidden=true;copyQr.hidden=true;
}
function connectionError(){
 resetOptions();intro.textContent='Unable to verify attendance right now.';show('Reconnect and retry. Attendance has not been confirmed.','error');retry.hidden=false;
}
async function signedOut(){
 resetOptions();
 try{
  const r=await fetch('/api/class-qr/check-in/mode',{cache:'no-store',credentials:'omit'});
  if(!r.ok)throw Error('Attendance method unavailable');
  const mode=await r.json();
  intro.textContent='No active student session in this browser.';copyQr.hidden=false;
  if(mode.pinEnabled){form.hidden=false;legacyOption.hidden=false;fallbackDivider.hidden=false;}
  else{legacy.hidden=false;legacyButton.hidden=true;studentSignIn.hidden=false;}
  show('Already signed in on your phone? Copy this QR link, return to that signed-in Student Portal, and use Scan class QR. Your browser may have opened a separate session.');
 }catch{connectionError();}
}
async function initialize(){
 resetOptions();intro.textContent='Checking your student session…';show('Verifying your sign-in securely…');
 try{
  const me=await fetch('/api/auth/me',{cache:'no-store',credentials:'same-origin'});
  if(me.status===401)return signedOut();
  if(!me.ok)throw Error('Session check unavailable');
  const user=(await me.json()).user;
  if(user?.role!=='STUDENT')return signedOut();
  if(user.mustChangePassword){
   intro.textContent='Update your initial password in the Student Portal before confirming attendance.';
   show('Change your password, then scan again.','error');document.getElementById('leaveCheckin').textContent='Open Student Portal';return;
  }
  intro.textContent='Signed in as '+user.displayName+'.';
  const statusR=await fetch('/api/class-qr/check-in/status?sessionId='+encodeURIComponent(sessionId),{cache:'no-store',credentials:'same-origin'});
  if(statusR.status===401)return signedOut();
  if(statusR.status===403||statusR.status===404){show('This class QR is not available to your account. Ask your teacher.','error');return;}
  if(!statusR.ok)throw Error('Status check unavailable');
  const status=await statusR.json();
  legacy.hidden=false;
  if(status.recorded){legacyButton.textContent='Already checked in';show('Attendance already recorded for this class.','success');clearPending();return;}
  legacyButton.disabled=false;show('Confirm attendance before the QR expires.');
 }catch{connectionError();}
}
legacyButton.addEventListener('click',async()=>{
 if(legacyButton.disabled)return;
 legacyButton.disabled=true;show('Submitting attendance to the school server…');
 try{
  const r=await fetch('/api/class-qr/check-in',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId,token:qrToken})});
  const d=await r.json().catch(()=>({}));
  if(r.ok||d.alreadyRecorded){legacyButton.textContent='Already checked in';clearPending();show(r.ok?'Attendance confirmed: '+d.status+'.':'Attendance already recorded for this class.','success');return;}
  if(r.status===401)return signedOut();
  if(r.status===410){show('This QR code expired or the session ended. Scan the latest teacher QR.','error');return;}
  show(d.error||'Attendance not recorded. Please retry.','error');legacyButton.disabled=false;
 }catch{show('Network unavailable. Attendance was NOT confirmed. Retry to check the server result.','error');legacyButton.disabled=false;}
});
initialize();
})();
</script>
</body></html>
