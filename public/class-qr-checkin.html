<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class QR Check-in · Attendigo</title><link rel="stylesheet" href="/portal.css"><style>main{max-width:460px;margin:8vh auto;padding:24px;background:var(--surface,#fff);border-radius:16px}button{padding:12px 20px}#message{padding:16px;margin-top:16px;border-radius:8px;background:#edf4ff}</style><link rel="icon" type="image/png" href="/assets/attendigo-favicon.png?v=2">
<link rel="apple-touch-icon" href="/assets/attendigo-apple-touch-icon.png?v=2">
<link rel="stylesheet" href="/attendigo-brand.css?v=2">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/attendigo-dark-unified.css?v=1"><script src="/dashboard-appearance.js?v=3"></script><link rel="stylesheet" href="/attendigo-brand-refresh.css?v=1">
  <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/typography.css?v=1">
</head><body class="portal-page"><div class="attendigo-brand"><img class="attendigo-logo" src="/assets/attendigo-sidebar-logo.png?v=2" alt="Attendigo" width="1800" height="430"></div><main><h1>Class attendance</h1><p>Sign in to your student account before confirming your class check-in.</p><button id="checkin">Confirm attendance</button><p id="message" role="status">Ready to check in.</p><p><a id="studentSignIn" href="/portal-login.html?mode=student">Sign in to confirm attendance</a></p><p><a id="leaveCheckin" href="/student-portal.html">Back to Student Dashboard</a></p></main><script>
const q=new URLSearchParams(location.search),button=document.getElementById('checkin'),msg=document.getElementById('message');
const pendingKey='schoolAttendance.pendingClassQr';
if(q.get('sessionId')&&q.get('token'))sessionStorage.setItem(pendingKey,location.pathname+location.search);
document.getElementById('studentSignIn').href='/portal-login.html?mode=student&returnTo='+encodeURIComponent(location.pathname+location.search);
document.getElementById('leaveCheckin').addEventListener('click',()=>{sessionStorage.removeItem(pendingKey);});
button.disabled=true;
fetch('/api/auth/me',{cache:'no-store',credentials:'same-origin'}).then(async r=>{
  if(!r.ok)throw Error('Sign-in required');
  const d=await r.json();
  if(d.user?.role!=='STUDENT'||d.user.mustChangePassword)throw Error('Student sign-in or password update required');
  const statusResponse=await fetch('/api/class-qr/check-in/status?sessionId='+encodeURIComponent(q.get('sessionId')||''),{cache:'no-store'});
  if(!statusResponse.ok)throw Error('Could not verify existing attendance');
  const status=await statusResponse.json();
  if(status.recorded){
    button.disabled=true;button.textContent='Already checked in';
    msg.textContent='Attendance already recorded ('+status.status+'). No further action is required.';
    sessionStorage.removeItem(pendingKey);return;
  }
  button.disabled=false;
  msg.textContent='Signed in as '+d.user.displayName+'. Confirm attendance before the QR expires.';
}).catch(e=>{button.disabled=true;msg.textContent=e.message==='Sign-in required'?'Student sign-in required. Open in Safari to keep your session.':'Unable to verify attendance status. Refresh this page before confirming.';});
button.onclick=async()=>{const token=sessionStorage.getItem('schoolAttendance.accessToken');
button.disabled=true;msg.textContent='Submitting to school server…';
try{const r=await fetch('/api/class-qr/check-in',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:q.get('sessionId'),token:q.get('token')}),cache:'no-store'});const d=await r.json();msg.textContent=r.ok?'Attendance confirmed: '+d.status+'.':(d.error||'Check-in failed. Scan the latest QR and retry.');if(r.ok||d.alreadyRecorded){sessionStorage.removeItem(pendingKey);button.disabled=true;button.textContent='Already checked in';msg.textContent=d.alreadyRecorded?'Attendance already recorded for this class. No further action is required.':'Attendance confirmed: '+d.status+'. No further action is required.';}else if(r.status===410){button.disabled=true;msg.textContent='QR code expired or session closed. Scan the latest QR code to continue.';}}
catch(e){msg.textContent='Network unavailable. Attendance was NOT recorded. Please retry with a fresh QR.';}finally{if(!button.textContent.includes('Already checked in')&&!msg.textContent.startsWith('QR code expired'))button.disabled=false;}};
</script></body></html>
