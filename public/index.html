  <title>Redirecting to sign in · Attendigo</title>
  <script>
    // Never forward credentials from a legacy query string to another URL.
    const params = new URLSearchParams(window.location.search);
    const mode = params.get('mode') === 'platform' ? '?mode=platform' : '';
    window.location.replace('/portal-login.html' + mode);
  </script>
