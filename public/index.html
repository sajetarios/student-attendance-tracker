<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2463a5">
  <meta name="referrer" content="no-referrer">
  <title>Redirecting to sign in · Attendigo</title>
  <script>
    // Route the main domain using verified server-side identity, never cached user data.
    (async () => {
      const params = new URLSearchParams(location.search);
      const requestedMode = params.get('mode');
      const loginUrl = '/portal-login.html' + (requestedMode === 'student' ? '?mode=student' : requestedMode === 'platform' ? '?mode=platform' : '');
      const go = url => location.replace(url);
      try {
        // Explicit role selection must remain accessible for account switching.
        if (requestedMode === 'platform') return go(loginUrl);
        const staffToken = sessionStorage.getItem('schoolAttendance.accessToken');
        const response = await fetch('/api/auth/me', {
          credentials: 'same-origin', cache: 'no-store',
          headers: staffToken ? { Authorization: 'Bearer ' + staffToken } : {}
        });
        if (response.ok) {
          const payload = await response.json();
          const role = payload?.user?.role;
          if (role === 'STUDENT') return go('/student-portal.html');
          if (role === 'PARENT') return go('/parent-portal.html');
          if (role === 'SUPER_ADMIN') return go('/portal.html');
          if (role) return go('/portal.html');
        }
        if (response.status === 401 && staffToken) {
          for (const key of ['schoolAttendance.accessToken','schoolAttendance.user','schoolAttendance.expiresAt']) sessionStorage.removeItem(key);
          // A stale staff token may mask a valid student cookie.
          const fallback = await fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'});
          if (fallback.ok) {
            const user = (await fallback.json()).user;
            if (user?.role === 'STUDENT') return go('/student-portal.html');
          }
        }
      } catch (_) { /* Offline or unavailable authentication: show login. */ }
      go(loginUrl);
    })();
  </script>
<link rel="icon" type="image/png" href="/assets/attendigo-favicon.png?v=2">
<link rel="apple-touch-icon" href="/assets/attendigo-apple-touch-icon.png?v=2">
<link rel="stylesheet" href="/attendigo-brand.css?v=2">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/attendigo-brand-refresh.css?v=4">
  <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/typography.css?v=1">
</head>
<body><div class="attendigo-brand"><img class="attendigo-logo" src="/assets/attendigo-official-lockup.svg?v=4" alt="Attendigo" width="1800" height="430"></div>
  <p>Checking your Attendigo session…
    <a href="/portal-login.html">Continue to sign in</a>
  </p>
</body>
</html>
