<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher QR Attendance · Attendigo</title><link rel="stylesheet" href="/portal.css"><style>main{max-width:740px;margin:30px auto;padding:24px}.panel{background:#fff;color:#172b44;border-radius:16px;padding:22px;margin:18px 0}select,button,input{padding:12px;margin:6px;max-width:100%;box-sizing:border-box}select{min-width:0;width:100%;margin:8px 0 12px;background:#fff;color:#172b44;border:1px solid #a6b4c8;border-radius:10px}button{border-radius:10px;cursor:pointer}.panel{overflow:hidden}#qr{display:block;max-width:320px;width:100%;margin:auto}#qr[hidden]{display:none}.muted{color:#64748b}#notice{font-weight:600}</style><link rel="icon" type="image/png" href="/assets/attendigo-icon.png">
<link rel="apple-touch-icon" href="/assets/attendigo-icon.png">
<link rel="stylesheet" href="/attendigo-brand.css?v=1">
<link rel="manifest" href="/manifest.webmanifest">
</head><body class="portal-page"><div class="attendigo-brand"><img class="attendigo-logo" src="/assets/attendigo-logo.png" alt="Attendigo" width="2172" height="724"></div><main><p><a href="/portal.html">← Dashboard</a></p><h1>Class QR Attendance</h1><p>Generate a rotating code for your assigned class. On-time grace: 10 minutes. QR closes 5 minutes before class ends.</p><section class="panel"><label for="period">Today's class</label><p id="schoolDate" class="muted"></p><select id="period"><option value="">Loading schedules…</option></select><button id="start">Start QR session</button><p id="notice" role="status"></p><div id="upcoming" class="muted" aria-live="polite"></div></section><section class="panel"><h2>Student check-in QR</h2><img id="qr" alt="Rotating class attendance QR code" hidden><p id="expiry" class="muted"></p><button id="close" disabled>Close session early</button></section><section class="panel"><h2>Manual attendance fallback</h2><p>Use only for a student who cannot submit a valid QR check-in. Each manual entry requires a reason.</p><input id="studentId" placeholder="Student ID" aria-label="Student ID"><input id="reason" placeholder="Reason for manual entry" aria-label="Reason"><button id="manual" disabled>Record manually</button><p id="manualNotice" role="status"></p></section></main><script src="/class-qr-teacher.js" defer></script></body></html>
