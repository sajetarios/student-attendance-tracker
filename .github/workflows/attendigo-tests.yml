name: Attendigo regression checks
on:
  push:
    branches: [fix/render-login-landing]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check server.js
      - run: node --check platform-plan-routes.js
      - run: node --check public/platform-plans-ui.js
