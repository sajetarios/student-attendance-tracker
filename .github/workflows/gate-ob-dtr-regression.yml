name: Attendigo gate, OB and DTR regression
on:
  push:
    branches:
      - fix/render-login-landing
      - 'feature/ob-*'
      - 'feature/form48-*'
      - 'feature/daily-self-*'
      - 'feature/clear-attendance-*'
      - 'feature/smart-attendance-*'
  pull_request:
    branches:
      - fix/render-login-landing
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate-ob-dtr:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Gate, OB and DTR regression tests
        run: node --test tests/gate-event-decision.test.js tests/gate-attendance-boundary.test.js tests/ob-dtr-remarks.test.js tests/gatekeeper-auto-integration.test.js tests/gate-dtr-reconciliation.test.js tests/gate-dtr-preview-route.test.js tests/gate-preview-regression.test.js tests/form48-intelligence-ui.test.js tests/staff-gate-dtr-ui.test.js tests/personal-attendance-insights.test.js tests/attendance-message-clarity.test.js tests/smart-attendance-overview.test.js tests/smart-attendance-setup-ui.test.js tests/staff-gate-dtr-auto.test.js tests/gate-dtr-admin-review.test.js tests/staff-leave-workflow.test.js tests/staff-leave-roles-and-form6.test.js tests/form48-calculations.test.js tests/form48-leave-remarks.test.js tests/pilot-leave-gate-dtr-journey.test.js tests/deped-sick-return-compliance.test.js tests/deped-sick-migration-registry.test.js tests/staff-leave-control-layout.test.js
      - name: Validate server and UI JavaScript syntax
        run: |
          node --check server.js
          node --check staff-gate-dtr-routes.js
          node --check staff-gate-dtr-review-routes.js
          node --check ob-dtr-remarks.js
          node --check gate-dtr-reconciliation.js
          node --check personal-attendance-insights.js
          node --check smart-attendance-overview.js
          node --check staff-attendance-schedule.js
          node --check staff-gate-dtr-auto.js
          node --check public/smart-attendance-overview.js
          node --check public/portal.js
          node --check public/form48-report.js
          node --check public/form48-intelligence.js
          node --check staff-leave-routes.js
          node --check staff-leave-deped-sick.js
          node --check scripts/migrate.js
          node --check form48-leave-remarks.js
          node --check form48-calculations.js
          node --check form48-review-routes.js
          node --check public/staff-leave-ui.js
          node --check public/leave-form6.js
