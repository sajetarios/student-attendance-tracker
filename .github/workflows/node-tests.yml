name: Node.js tests

on:
  pull_request:
    branches:
      - fix/render-login-landing
      - improve/admin-user-management-edit-forms
  push:
    branches:
      - fix/render-login-landing
      - feature/admin-department-scheduling-coverage
      - feature/compact-staff-ui
      - fix/teacher-monitor-table-columns
      - fix/force-portal-service-worker-refresh
      - feature/student-management-ux
      - feature/app-dialog-ui
      - feature/class-adviser-schedule-and-student-import-fixes
      - feature/schedule-subject-catalog-and-form-consistency
      - fix/guardian-import-and-schedule-form
      - dashboard-ui-inspiration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_attendance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d school_attendance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/school_attendance_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check staff-lunch-routes.js
          node --check staff-gate-dtr-routes.js
          node --check notification-routes.js
          node --check public/universal-notifications.js
          node --check student-management-routes.js
          node --check student-portal-account-routes.js
          node --check public/student-portal-accounts.js
          node --check public/admin-request-notifications.js
          node --check public/guardian-ui.js
          node --check public/portal.js
          node --check public/academic-admin.js
          node --check public/parent-admin.js
          node --check public/app-dialog.js
          node --check public/sw-refresh.js
          node --check department-routes.js
          node --check cloud-sync-routes.js
          node --check sf2-routes.js
      - name: Run test suite
        run: npm test

      - name: Validate complete PostgreSQL migration chain
        run: npm run db:migrate
      - name: Verify JHS/SHS level isolation and tracks against temporary PostgreSQL
        run: node tests/shs-grade-offerings-postgres.cjs
      - name: Verify school deletion handles pilot reset archives and preserves other schools
        run: node tests/platform-school-deletion-postgres.cjs
      - name: Verify concurrent staff lunch QR and Gatekeeper DTR against PostgreSQL
        run: node tests/staff-lunch-postgres.cjs
      - name: Verify notification event creation and idempotence against PostgreSQL
        run: node tests/universal-notifications-postgres.cjs
      - name: Verify mixed attendance cloud relay against isolated PostgreSQL
        run: node tests/cloud-mixed-postgres.cjs

  recovery_validation:
    name: Recovery flow / PostgreSQL validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_attendance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d school_attendance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/school_attendance_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate recovery API code and guards
        run: |
          node --check school-admin-recovery-routes.js
          node --test tests/school-admin-recovery.test.js
      - name: Verify student account approvals and notification UI
        run: |
          node --check student-portal-account-routes.js
          node --check public/admin-request-notifications.js
          node --check public/guardian-ui.js
          node --check public/student-portal-accounts.js
          node --test tests/student-portal-accounts.test.js tests/approval-inbox-regression.test.js
      - name: Verify student login and roster restoration
        run: |
          node --check auth-routes.js
          node --check public/portal.js
          node --test tests/student-portal-login-roster-fix.test.js
      - name: Create fresh PostgreSQL schema
        run: npm run db:migrate
      - name: Test full one-time reset against PostgreSQL
        run: node tests/recovery-smoke.cjs
      - name: Test persistent photo approvals and access controls against PostgreSQL
        run: node tests/photo-smoke.cjs

