name: Node.js tests

on:
  pull_request:
    branches:
      - fix/render-login-landing
      - improve/admin-user-management-edit-forms
  push:
    branches:
      - fix/render-login-landing
      - feature/admin-department-scheduling-coverage
      - feature/compact-staff-ui
      - fix/teacher-monitor-table-columns
      - fix/force-portal-service-worker-refresh
      - feature/student-management-ux
      - feature/app-dialog-ui
      - feature/class-adviser-schedule-and-student-import-fixes
      - feature/schedule-subject-catalog-and-form-consistency
      - fix/guardian-import-and-schedule-form
      - dashboard-ui-inspiration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_attendance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d school_attendance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/school_attendance_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check staff-lunch-routes.js
          node --check staff-gate-dtr-routes.js
          node --check notification-routes.js
          node --check public/universal-notifications.js
          node --check student-management-routes.js
          node --check student-portal-account-routes.js
          node --check public/student-portal-accounts.js
          node --check public/admin-request-notifications.js
          node --check public/guardian-ui.js
          node --check public/portal.js
          node --check public/academic-admin.js
          node --check public/parent-admin.js
          node --check public/app-dialog.js
          node --check public/sw-refresh.js
          node --check department-routes.js
          node --check cloud-sync-routes.js
          node --check sf2-routes.js
      - name: Run test suite
        id: unit_tests
        # Keep the job red when npm test fails, but still exercise PostgreSQL
        # migrations and integration scenarios to expose independent defects.
        continue-on-error: true
        run: npm test

      - name: Validate complete PostgreSQL migration chain
        run: npm run db:migrate
      - name: Verify JHS/SHS level isolation and tracks against temporary PostgreSQL
        run: node tests/shs-grade-offerings-postgres.cjs
      - name: Verify school deletion handles pilot reset archives and preserves other schools
        run: node tests/platform-school-deletion-postgres.cjs
      - name: Verify concurrent staff lunch QR and Gatekeeper DTR against PostgreSQL
        run: node tests/staff-lunch-postgres.cjs
      - name: Verify School Admin gate-to-DTR approval, audit and tenant isolation against PostgreSQL
        run: node tests/gate-dtr-admin-review-postgres.cjs
      - name: Use official PostgreSQL 16 client container to match restore target
        run: |
          mkdir -p "$RUNNER_TEMP/pg16-tools"
          cat > "$RUNNER_TEMP/pg16-tools/pg_dump" <<'EOF'
          #!/bin/sh
          exec docker run --rm --network host -v /tmp:/tmp -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE postgres:16 pg_dump "$@"
          EOF
          cat > "$RUNNER_TEMP/pg16-tools/pg_restore" <<'EOF'
          #!/bin/sh
          exec docker run --rm --network host -v /tmp:/tmp -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE postgres:16 pg_restore "$@"
          EOF
          chmod +x "$RUNNER_TEMP/pg16-tools/pg_dump" "$RUNNER_TEMP/pg16-tools/pg_restore"
          echo "$RUNNER_TEMP/pg16-tools" >> "$GITHUB_PATH"
      - name: Verify encrypted PostgreSQL backup and full restore in disposable database
        env:
          PGPASSWORD: postgres
          ATTENDIGO_PRIMARY_DATABASE: render
          ATTENDIGO_BACKUP_KEY_BASE64: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
          ATTENDIGO_RESTORE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/attendigo_restore_test
        run: |
          pg_dump --version
          node scripts/verified-database-backup.js backup "$RUNNER_TEMP/attendigo-test.attbk"
          createdb -h localhost -U postgres attendigo_restore_test
          node scripts/verified-database-backup.js restore-test "$RUNNER_TEMP/attendigo-test.attbk"
          psql -h localhost -U postgres -d attendigo_restore_test -Atc "SELECT COUNT(*) FROM schema_migrations;" | grep -E '[1-9]'
          rm -f "$RUNNER_TEMP/attendigo-test.attbk"
      - name: Verify notification event creation and idempotence against PostgreSQL
        run: node tests/universal-notifications-postgres.cjs
      - name: Verify mixed attendance cloud relay against isolated PostgreSQL
        run: node tests/cloud-mixed-postgres.cjs
      - name: Enforce full regression gate
        if: always()
        run: |
          if [ "${{ steps.unit_tests.outcome }}" != "success" ]; then
            echo "::error::Node.js unit/regression tests failed. PostgreSQL checks were allowed to run for diagnostic coverage."
            exit 1
          fi

  recovery_validation:
    name: Recovery flow / PostgreSQL validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
