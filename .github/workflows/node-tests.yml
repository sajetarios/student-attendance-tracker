        options: >-
          --health-cmd "pg_isready -U postgres -d school_attendance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/school_attendance_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate recovery API code and guards
        run: |
          node --check school-admin-recovery-routes.js
          node --test tests/school-admin-recovery.test.js
      - name: Verify student account approvals and notification UI
        run: |
          node --check student-portal-account-routes.js
          node --check public/admin-request-notifications.js
          node --check public/guardian-ui.js
          node --check public/student-portal-accounts.js
          node --test tests/student-portal-accounts.test.js tests/approval-inbox-regression.test.js
      - name: Verify student login and roster restoration
        run: |
          node --check auth-routes.js
          node --check public/portal.js
          node --test tests/student-portal-login-roster-fix.test.js
      - name: Create fresh PostgreSQL schema
        run: npm run db:migrate
      - name: Test full one-time reset against PostgreSQL
        run: node tests/recovery-smoke.cjs
      - name: Test persistent photo approvals and access controls against PostgreSQL
        run: node tests/photo-smoke.cjs


