name: Principal Insights verified data gate
on:
  pull_request:
    branches: [fix/render-login-landing]
    paths:
      - 'principal-insights-routes.js'
      - 'public/principal-insights.js'
      - 'public/principal-insights.css'
      - 'public/portal.html'
      - 'public/portal.js'
      - 'server.js'
      - 'tests/principal-insights-*'
      - '.github/workflows/principal-insights-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  principal-insights:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_attendance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d school_attendance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/school_attendance_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax and scoped executive unit tests
        run: |
          node --check principal-insights-routes.js
          node --check public/principal-insights.js
          node --check public/portal.js
          node --test tests/principal-insights-routes.test.js tests/principal-insights-ui.test.js
      - name: Add standard optional roles for the legacy Supabase migration
        run: |
          node - <<'NODE'
          const {Client}=require('pg');
          (async()=>{
            const db=new Client({connectionString:process.env.DATABASE_URL});
            await db.connect();
            try{
              await db.query("DO $$ BEGIN IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon; END IF; IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated; END IF; END $$;");
            }finally{await db.end();}
          })().catch(err=>{console.error(err.message);process.exitCode=1;});
          NODE
      - name: Apply real migrations to disposable PostgreSQL
        run: npm run db:migrate
      - name: Test real Principal metrics and cross-school isolation
        run: node tests/principal-insights-postgres.cjs
