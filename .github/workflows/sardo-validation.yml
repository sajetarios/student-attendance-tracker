name: SARDO feature validation
on:
  push:
    branches: [fix/render-login-landing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sardo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_attendance_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d school_attendance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/school_attendance_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate feature JavaScript syntax
        run: |
          node --check server.js
          node --check sardo-routes.js
          node --check class-finalization-routes.js
          node --check manual-attendance-routes.js
          node --check public/sardo-monitor.js
          node --check public/manual-folio.js
          node --check public/portal.js
          node --check public/sw.js
      - name: Test SARDO day counting and confirmation rules
        run: node --test tests/sardo-monitoring.test.js
      - name: Validate additive migrations against clean PostgreSQL
        run: npm run db:migrate
