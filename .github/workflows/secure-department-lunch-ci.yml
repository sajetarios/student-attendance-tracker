name: Department lunch QR security (isolated PostgreSQL)
on:
  pull_request:
    branches: [fix/render-login-landing]
    paths:
      - 'staff-lunch-*.js'
      - 'public/staff-lunch-*'
      - 'public/staff-department-location.js'
      - 'public/staff-precise-location.js'
      - 'public/portal.html'
      - 'public/sw.js'
      - 'tests/staff-lunch-*'
      - '.github/workflows/secure-department-lunch-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  department-lunch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_attendance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d school_attendance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/school_attendance_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate API and browser JavaScript syntax
        run: |
          node --check staff-lunch-location.js
          node --check staff-lunch-routes.js
          node --check public/staff-lunch-ui.js
          node --check public/staff-department-location.js
          node --check public/staff-precise-location.js
          node --check public/staff-lunch-checkin.js
      - name: Run focused lunch and Gatekeeper unit tests
        run: |
          node --test tests/staff-lunch-challenge.test.js tests/staff-lunch-location.test.js tests/staff-lunch-routes.test.js tests/staff-lunch-multi-presenter.test.js tests/staff-lunch-ui-security.test.js tests/staff-gate-dtr-ui.test.js tests/ob-dtr-remarks.test.js
      - name: Install optional database roles used by existing DepEd migration
        run: |
          node - <<'NODE'
          const {Client}=require('pg');
          (async()=>{
            const db=new Client({connectionString:process.env.DATABASE_URL});
            await db.connect();
            try {
              await db.query("DO $$ BEGIN IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon; END IF; IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated; END IF; END $$;");
            } finally { await db.end(); }
          })().catch(error=>{console.error(error.message);process.exitCode=1;});
          NODE
      - name: Validate schema in disposable CI PostgreSQL
        run: npm run db:migrate
      - name: Validate real lunch QR, location, independent review and Gatekeeper flows
        run: node tests/staff-lunch-postgres.cjs
