name: Attendigo PDF dependency upgrade experiment
on:
  push:
    branches: [security/20261122-npm-audit]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lockfile from explicitly reviewed package versions
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify reproducible install
        run: npm ci --no-audit --no-fund
      - name: Check PDF import tests
        run: node --test tests/sf1-pdf-import.test.js tests/sf1-positioned-pdf-layout.test.js
      - name: Run full regression suite
        run: npm test
      - name: Block critical and high dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Commit verified lockfile only to non-production branch
        shell: bash
        run: |
          git diff --exit-code -- package.json
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(deps): lock tested PDF.js upgrade'
            git push origin HEAD:security/20261122-npm-audit
          fi
