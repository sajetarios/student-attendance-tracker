name: Acquire verified DepEd Locator Slip master
on:
  push:
    branches: [fix/locator-slip-bundled-template-20261125]
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Acquire original exact official PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p templates
          target=templates/Revised-Annex-E.pdf
          expected=6d340f2f6548c7736ec40cc8c2cc0f0e902d77f713da3ef93f721b92e66745c9
          verify() { echo "$expected  $1" | sha256sum -c -; }
          if test -f "$target" && verify "$target"; then exit 0; fi
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          for url in 'https://www.deped.gov.ph/wp-content/uploads/2022/10/Revised-Annex-E.pdf?utm_source=chatgpt.com' 'https://www.deped.gov.ph/wp-content/uploads/2022/10/Revised-Annex-E.pdf' 'https://deped.gov.ph/wp-content/uploads/2022/10/Revised-Annex-E.pdf'; do
            if curl --fail --location --max-time 25 --max-filesize 200000 --user-agent 'Mozilla/5.0' --header 'Accept: application/pdf,*/*' --referer 'https://www.deped.gov.ph/' "$url" -o "$tmp" && verify "$tmp"; then
              cp "$tmp" "$target"
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add "$target"
              git commit -m 'Bundle checksum-verified official DepEd Locator Slip master'
              git push origin HEAD:fix/locator-slip-bundled-template-20261125
              exit 0
            fi
          done
          echo '::error::Could not acquire the exact master PDF; upload the supplied original to templates/Revised-Annex-E.pdf.'
          exit 1
