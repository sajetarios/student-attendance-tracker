name: Attendigo responsive browser geometry
on:
  pull_request:
    paths:
      - 'public/**'
      - 'scripts/check-responsive-layout.cjs'
      - '.github/workflows/responsive-browser.yml'
permissions:
  contents: read
jobs:
  responsive-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/check-responsive-layout.cjs
      - run: node scripts/check-shared-experience.cjs

      - run: node scripts/check-actual-staff-attendance.cjs
