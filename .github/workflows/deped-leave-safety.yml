name: DepEd Leave + DTR Safety
on:
  push:
    branches: [feature/deped-leave-vsc-workflow-20261122, feature/leave-gate-profile-indicators-20261122, feature/leave-approval-inbox-role-nav-20261123]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  leave-and-attendance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attendigo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax check all new modules and existing server
        run: |
          node --check server.js
          node --check staff-leave-routes.js
          node --check staff-leave-inbox.js
          node --check staff-leave-inbox-routes.js
          node --check public/leave-approval-inbox.js
          node --check public/universal-notifications.js
          node --check staff-leave-policy.js
          node --check staff-approved-leave-status.js
          node --check staff-gate-dtr-routes.js
          node --check public/staff-leave-ui.js
          node --check public/leave-form6.js
          node --check public/portal.js
          node --check form48-leave-remarks.js
      - name: Leave workflow validations
        run: node --test tests/staff-leave-workflow.test.js tests/staff-leave-indicators.test.js tests/staff-leave-inbox.test.js
      - name: Existing gate, OB, Form48 and leave-remarks tests
        run: node --test tests/gate-event-decision.test.js tests/gate-attendance-boundary.test.js tests/gate-dtr-reconciliation.test.js tests/gate-dtr-preview-route.test.js tests/ob-dtr-remarks.test.js tests/form48-leave-remarks.test.js tests/form48-calculations.test.js tests/staff-gate-dtr-auto.test.js tests/staff-ob-routes.test.js tests/staff-gate-dtr-ui.test.js tests/gate-preview-regression.test.js tests/gatekeeper-auto-integration.test.js tests/gatekeeper-single-step-ui.test.js
      - name: Real PostgreSQL leave migration and constraints
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/attendigo_test
        run: node tests/leave-postgres-smoke.cjs
      - name: Migration ordering regression
        run: node --test tests/migration-chain.test.js
