name: Desktop installers
on:
  push:
    branches: [feature/offline-desktop-packages]
    paths: ['desktop/**', '.github/workflows/desktop-installers.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist -- --${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: attendance-${{ matrix.target }}-installers
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
