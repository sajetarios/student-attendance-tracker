name: QR attendance checks
on:
  pull_request:
    branches: [fix/render-login-landing]
  push:
    branches: [feature/schedule-qr-attendance]
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node --check class-qr-routes.js
      - run: node --check public/class-qr-teacher.js
      - run: node --check public/class-qr-dashboard-link.js
      - run: node --test tests/class-qr.test.js
