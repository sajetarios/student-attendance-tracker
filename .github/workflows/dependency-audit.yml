name: Attendigo dependency security gate
on:
  push:
    branches: [fix/render-login-landing]
  pull_request:
    branches: [fix/render-login-landing]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-and-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Reproducible dependency install
        run: npm ci --no-audit --no-fund
      - name: Reject moderate, high, or critical dependency advisories
        run: npm audit --omit=dev --audit-level=moderate
      - name: Validate PDF, SF2 and backup compatibility on Node 24
        run: node --test tests/sf1-pdf-import.test.js tests/sf1-positioned-pdf-layout.test.js tests/sf2-official-template.test.js tests/backup-restore-crypto.test.js
      - name: Check server and import syntax
        run: |
          node --check server.js
          node --check sf1-pdf-parser.js
          node --check sf2-routes.js
