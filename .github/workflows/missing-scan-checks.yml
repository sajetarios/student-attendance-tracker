name: Missing scan workflow checks
on:
  push:
    branches:
      - deploy/missing-scan-staging-production-20261123
  pull_request:
    paths:
      - "missing-scan-routes.js"
      - "tests/missing-scan-policy.test.js"
      - "tests/missing-scan-postgres.cjs"
      - "public/missing-scan-ui.js"
      - "public/form48-report.js"
      - "server.js"
      - "migrations/080_missing_scan_department_logbook_review.sql"
jobs:
  missing-scan:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_attendance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d school_attendance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/school_attendance_test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check missing-scan-routes.js && node --check public/missing-scan-ui.js && node --check server.js && node --check public/form48-report.js
      - run: node --test tests/missing-scan-policy.test.js
      - run: npm run db:migrate
      - run: node tests/missing-scan-postgres.cjs
